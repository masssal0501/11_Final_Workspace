# =========================================================
# Production 프로필 (EC2 배포용)
#
# 활성화: SPRING_PROFILES_ACTIVE=prod
# (systemd 서비스 파일에서 Environment=SPRING_PROFILES_ACTIVE=prod 로 설정)
#
# 이 파일에는 기본값을 두지 않는다 - 아래 값들은 전부 EC2의
# systemd 서비스 Environment 설정(또는 /etc/workflow/workflow.env)으로
# 주입되는 환경변수가 반드시 있어야 정상 기동된다. 이렇게 해야
# "환경변수를 깜빡하고 안 넣었더니 로컬 기본값으로 조용히 뜨는" 사고를 막을 수 있다.
# =========================================================

# RDS MySQL 연결 정보 - DB_URL / DB_USERNAME / DB_PASSWORD 환경변수 필수
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 운영에서는 SQL/DDL 로그를 끔 (필요 시 개별적으로 다시 켤 것)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini API 키 - GEMINI_API_KEY 환경변수 필수
# application.properties의 기본값(spring.ai.model.chat=none)을 운영에서는 다시 활성화한다.
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 메일 - MAIL_USERNAME / MAIL_PASSWORD 환경변수 필수
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT - JWT_SECRET 환경변수 필수 (충분히 긴 랜덤 값으로, 로컬 기본값을 재사용하지 말 것)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS - 실제 서비스 도메인/EC2 접속 주소로 CORS_ALLOWED_ORIGINS 환경변수 지정 필수
# (Nginx가 프론트/백엔드를 같은 origin으로 프록시하므로 대부분의 요청은 same-origin이라
#  CORS 헤더가 필요 없지만, 다른 origin에서의 직접 API 호출 가능성을 대비해 명시적으로 지정)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# 파일 업로드 경로 - EC2 상의 실제 저장 경로 (systemd 서비스가 쓰기 권한을 가진 디렉터리)
app.upload.receipts-dir=${APP_UPLOAD_RECEIPTS_DIR:/opt/workflow/uploads/receipts/}
# Hub/Place 썸네일 이미지 - FileRenamePolicy가 읽는 APP_UPLOAD_HUB_DIR과 동일한 값이어야 한다
app.upload.hub-dir=${APP_UPLOAD_HUB_DIR:/opt/workflow/uploads/hub/}
# TODO-N02: 워케이션 후기 사진
app.upload.reviews-dir=${APP_UPLOAD_REVIEWS_DIR:/opt/workflow/uploads/reviews/}

logging.level.root=INFO
