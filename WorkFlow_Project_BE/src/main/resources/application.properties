spring.application.name=WorkFlow_Project_BE

server.servlet.context-path=/workflow
server.port=8006

# DB 접속정보 셋팅 - MySQL 연동 구문
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/workflow
# 내 로컬 컴퓨터의 3306 (mysql 의 기본 포트번호) 의 fullstack 라는 스키마에 접속하겠다.
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update
# update 로 두는 이유는 내가 직접 ddl 구문을 이용해서 DB 테이블 구축을 할 것이기 때문!!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 파일업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 이메일 관련 셋팅
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
