# 1. 애플리케이션 이름
spring.application.name=WorkFlow_Project_BE

# 2. 포트 설정 (기본값: 8080)
server.port=8006

# 3. MySQL 데이터베이스 연결
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/workflow?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql

# 4. MyBatis 설정
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.workflow.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 5. SQL 로깅 (개발 환경용)
logging.level.com.workflow.mapper=DEBUG