spring.application.name=WorkFlow_Project_BE

server.servlet.context-path=/workflow
server.port=8001

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/workflow

spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update
# update 로 두는 이유는 내가 직접 ddl 구문을 이용해서 DB 테이블 구축을 할 것이기 때문!!
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Google Gemini API 연동 설정
# API 키 설정
spring.ai.google.genai.api-key=AQ.Ab8RN6KUru5Ig8DxYdpb7pCjM8vfD87E8IY_UejEAOkJRqnTLA

# 사용할 Gemini 버전 선택
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
# 파일업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
