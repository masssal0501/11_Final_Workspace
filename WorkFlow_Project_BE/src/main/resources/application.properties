# =========================================================
# 공통 설정 (모든 프로필에서 적용)
#
# 이 파일은 Git에 커밋되는 파일이므로 실제 비밀번호/키 값을
# 절대 직접 적지 않는다. 민감한 값은 전부 ${환경변수} 형태로
# 참조하고, 로컬 개발 편의를 위한 기본값(:뒤의 값)만 넣는다.
#
# Production 배포 시에는 application-prod.properties가
# 이 파일의 값을 덮어쓰며(SPRING_PROFILES_ACTIVE=prod),
# 그쪽은 기본값 없이 환경변수를 필수로 요구한다.
# =========================================================

# 1. 애플리케이션 이름
spring.application.name=WorkFlow_Project_BE

# 전역 @ControllerAdvice가 없어 컨트롤러/서비스에서 던진 IllegalArgumentException 등의
# 메시지(예: "이미 출근 처리되었습니다.")가 기본적으로 응답 본문에서 빠지고 항상 빈 500만
# 내려가던 문제를 해결한다. 스택트레이스(include-stacktrace)는 여전히 노출하지 않는다.
# 주의: Spring Boot 4.x부터 이 설정의 프로퍼티 키가 server.error.*에서 spring.web.error.*로
# 이동했다(WebProperties.Error, spring.web 프리픽스). server.error.include-message는 더 이상
# 인식되지 않으므로 반드시 아래 키를 사용해야 한다.
spring.web.error.include-message=always

server.servlet.context-path=/workflow
server.port=8006

# 2. DB 연결 (로컬 개발 기본값 - 필요 시 환경변수로 재정의 가능)
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workflow}
#spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=${DB_PASSWORD:mysql}

#임시
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/workflow
spring.datasource.username=root
spring.datasource.password=mysql



# ddl-auto는 사용하지 않음 - SQL/WorkFlow_Script.sql로 직접 스키마를 구축한다
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Google Gemini API 연동 설정
# 실제 키는 절대 여기에 적지 않는다 - GEMINI_API_KEY 환경변수로만 주입
# spring.ai.model.chat 기본값은 "none" - GEMINI_API_KEY가 없는 로컬 개발 환경에서
# Spring AI의 GoogleGenAiChatAutoConfiguration이 무조건 활성화되어(matchIfMissing=true)
# "Incomplete Google GenAI configuration" 예외로 앱 전체가 기동 실패하던 문제를 방지한다.
# 실제 키가 있는 환경(application-prod.properties)에서만 google-genai로 재활성화한다.
spring.ai.model.chat=none
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# 파일업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 4. 이메일 관련 셋팅
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 5. JWT
# 실제 운영 secret은 절대 여기에 적지 않는다 - JWT_SECRET 환경변수로만 주입.
# 아래 기본값은 로컬 개발 전용이며 운영에서 그대로 쓰면 안 되는 값임을 이름에서 알 수 있게 해둠.
jwt.secret=${JWT_SECRET:LOCAL_DEV_ONLY_INSECURE_CHANGE_ME_1234567890}
jwt.expiration=${JWT_EXPIRATION:3600000}

# 6. CORS (SecurityConfig에서 사용) - 콤마로 여러 origin 지정 가능
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 7. 파일 업로드 경로
app.upload.receipts-dir=${APP_UPLOAD_RECEIPTS_DIR:C:/upload/receipts/}

###################

# 8. MyBatis 설정 (Notice 모듈은 JPA로 전환 완료 - 남은 mapper 없음)
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.workflow.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 9. SQL 로깅 (개발 환경용)
logging.level.com.workflow.mapper=DEBUG
