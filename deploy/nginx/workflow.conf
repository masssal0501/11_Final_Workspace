# WorkFlow ERP - Nginx site config
#
# 배포 위치 (Ubuntu — sites-available/sites-enabled 구조를 쓰는 경우):
#   /etc/nginx/sites-available/workflow.conf
#   -> /etc/nginx/sites-enabled/workflow.conf 로 심볼릭 링크
#   (/etc/nginx/nginx.conf의 http 블록에 `include /etc/nginx/sites-enabled/*;`가 있는지 확인)
#   기본 사이트(default)는 충돌 방지를 위해 sites-enabled에서 제거하는 것을 권장
#
# 배포 위치 (Amazon Linux — conf.d 구조를 쓰는 경우, 2026-09-09 실제 배포 환경):
#   /etc/nginx/conf.d/workflow.conf 에 이 파일을 그대로 두면 됨(심볼릭 링크 불필요)
#   ⚠️ Amazon Linux의 기본 nginx.conf에는 `server { listen 80; ... }` 블록이 파일 안에
#      직접 내장되어 있어, 그대로 두면 포트 80을 먼저 점유해 이 설정이 무시될 수 있다.
#      nginx.conf 안의 그 기본 server 블록을 주석 처리하거나, 아래 listen 지시문에
#      `default_server`를 추가해 이 설정이 확실히 우선되도록 할 것.
#      (`grep -n include /etc/nginx/nginx.conf`로 conf.d가 먼저 include되는지도 확인)
#
# 구조:
#   /              -> React 정적 파일 (workflow_project_fe의 빌드 결과, dist/)
#   /workflow/**   -> Spring Boot (context-path=/workflow, 포트 8006, 같은 EC2의 localhost)
#
# React Router를 사용하므로 새로고침 시 404가 나지 않도록
# try_files로 index.html에 폴백시킨다.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 실제 도메인이 있다면 여기에 지정 (예: workflow.example.com)

    root /usr/share/nginx/html;
    index index.html;

    # Spring Boot API - context-path가 /workflow이므로 경로를 그대로 프록시한다
    # (rewrite 없이 /workflow/ 그대로 넘겨야 context-path와 일치함)
    location /workflow/ {
        proxy_pass         http://127.0.0.1:8006/workflow/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Spring 쪽 spring.servlet.multipart.max-*-size=10MB 보다
        # 여유 있게 잡아 파일 업로드가 Nginx 단에서 먼저 막히지 않게 함
        client_max_body_size 12m;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # React 정적 파일 (SPA) - 새로고침 시 404 방지용 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산 캐싱 (선택 사항)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
