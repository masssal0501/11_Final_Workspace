<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myweb</title>
    <!--
      * 리액트에서도 BootStrap 프레임워크를 연동해서 쓸 수 있다!!
      1. 프로젝트 폴더 내에서 npm install bootstrap 명령문을 이용해서 설치하는 방법
      2. Single Page 를 나타내는 index.html 의 head 영역에 평소대로 CDN 방식을 이용하는 방법

      - 어느 방법으로 연동했든 간에 사용법 (주어진 class 속성을 주는 것) 은 똑같다!!
      - 단, npm install 을 이용해서 설치하면 각 컴포넌트마다 import 해줘야하는 번거로움이 있다.
    -->
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- jQuery library : 우리는 axios 를 이용하므로 slim 버전으로 갖고올 것 -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>

    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
